[package]
name = "voxeldust-core"
version.workspace = true
edition.workspace = true

[features]
rapier = ["dep:rapier3d"]
bytemuck = ["dep:bytemuck"]

[dependencies]
voxeldust-types = { workspace = true }
voxeldust-protocol-fb = { workspace = true }
voxeldust-signal = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
flatbuffers = { workspace = true }
thiserror = { workspace = true }
brahe = { workspace = true }
nalgebra = { workspace = true }
lz4_flex = { workspace = true }
gooding-lambert = { workspace = true }
bevy_ecs = { workspace = true }
rapier3d = { workspace = true, optional = true }
binary-greedy-meshing = { workspace = true }
bytemuck = { workspace = true, optional = true }
smallvec = { workspace = true }
# `media.rs` reuses signal's HMAC infrastructure for media-payload auth
# (hmac/sha2/subtle); `ecs/components.rs` uses `rand` for one-shot RNG seeds
# at component spawn. `base64` and `metrics` were exclusively signal deps and
# moved with the subsystem to `voxeldust-signal`'s manifest.
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
