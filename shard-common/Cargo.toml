[package]
name = "voxeldust-shard-common"
version.workspace = true
edition.workspace = true

[dependencies]
voxeldust-core = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
flatbuffers = { workspace = true }
lz4_flex = { workspace = true }
bevy_ecs = { workspace = true }
bevy_app = { workspace = true }
bevy_tasks = { workspace = true }
# Used by `signal_pipeline::apply_remote_signal_publish` to set the
# `source_position` zero-vector on outbound `SignalBroadcastBatch`
# messages issued from grant-bearing publishes.
glam = { workspace = true }
# Used by `signal_pipeline::apply_add_held_grant` to construct mirror
# grants with empty channel coverage (filled in at Listener config time).
smallvec = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
# redb embedded KV store. Used by `grant_persistence` for shard-local
# `RemoteAccessGrant` durability across restarts. The shard binary
# owns the database file; this crate provides the helpers and the
# `Bevy` queue resource that drains into it.
redb = { workspace = true }

[dev-dependencies]
# Tempdir for redb-backed unit tests (grant_persistence, etc).
tempfile = { workspace = true }
