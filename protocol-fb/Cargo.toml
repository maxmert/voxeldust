[package]
name = "voxeldust-protocol-fb"
version.workspace = true
edition.workspace = true

# Holds the FlatBuffers-generated wire types (`voxeldust_generated.rs`,
# ~25k lines, 961 KB). Pulled out of `voxeldust-core` so that schema
# regeneration only invalidates this crate plus its direct importers
# (shard_message, client_message), instead of cascading rebuild through
# every workspace crate.
#
# Regenerated by `./build_protocol.sh`. Do not edit `src/voxeldust_generated.rs`
# by hand — every edit will be overwritten on the next regen.

[dependencies]
flatbuffers = { workspace = true }
