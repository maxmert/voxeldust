[package]
name = "vd-connection-plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Gateway internals as a LIBRARY: lock-free route table (ArcSwap), per-session multiplexing, BULK pacing, datagram partitioning, ResumeTicket handling. The gateway bin is a thin shell."

[dependencies]
vd-core = { workspace = true }
vd-wire = { workspace = true }
vd-sim = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
thiserror = { workspace = true }
arc-swap = { workspace = true }
bevy_ecs = { workspace = true }
tracing = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# HR5: unit tests install a TRACE sink so every tracing macro's lazy field closure
# EVALUATES on the paths the tests already drive — without it the closures are dead
# regions coverage can never reach (no subscriber ⇒ tracing skips them).
tracing-subscriber = { workspace = true }
# SPIKE-2a's p99 latency gate uses the ONE shared `vd_harness::latency::percentile_unstable`
# (HR3 one-tooling, shared with SPIKE-3a). A dev-scope edge only: it never inverts the
# bins→node→sim→wire→core build graph (harness sits above node, and this is test-only).
vd-harness = { workspace = true }

[lints]
workspace = true
