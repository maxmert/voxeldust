[package]
name = "vd-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "build_app(NodeKind, cfg, io) for ALL node kinds; step_tick() is THE deterministic unit of progress. Bins are 4-line wrappers elsewhere; nothing depends on a bin."

[dependencies]
vd-core = { workspace = true }
vd-wire = { workspace = true }
vd-sim = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
thiserror = { workspace = true }
glam = { workspace = true }
bevy_ecs = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# DEV-ONLY: the rlm runtime test builds THE world; shipped node code reads books, never motion (SL4).
vd-physics = { workspace = true }
proptest = { workspace = true }
# HR5: unit tests install a TRACE sink so every tracing macro's lazy field closure
# EVALUATES on the paths the tests already drive — without it the closures are dead
# regions coverage can never reach (no subscriber ⇒ tracing skips them).
tracing-subscriber = { workspace = true }

[lints]
workspace = true
