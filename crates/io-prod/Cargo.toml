[package]
name = "vd-io-prod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Production ShardIo implementations: quinn QUIC transport bridged to the synchronous step_tick via crossbeam queues (reader/writer tasks). Tier-B coverage (process-tier, ratcheted floor)."

[features]
default = []
# TEST-ONLY (D-6 D-delta): the off-tick RedbStore writer-pause hook for the process-tier SIGKILL-mid-fsync
# crash proof. ABSENT from release builds (a compile fact, mirroring vd-bins `dev-control`) — the pause field
# + park code only exist under this flag. Enabled by the crash test via `vd-bins/store-test-hooks`.
store-test-hooks = []

[dependencies]
vd-core = { workspace = true }
vd-sim = { workspace = true }
# S3: the io-prod probe HTTP glue (probe.rs) adapts vd-node's PURE, Tier-A health decision surface
# (HealthReport / is_live / the per-role predicates). Cycle-safe: vd-node depends on vd-io-prod only as a
# DEV-dependency (tests), so the normal lib graph io-prod → node → sim → wire → core has no cycle.
vd-node = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
crossbeam-channel = { workspace = true }
# CA-1 S2 — the shared updatable peer-address topology (outbound L5 re-plumb): lock-free copy-on-write reads on
# the dial hot path, rcu updates via MeshControl::update_peer_addr. Reuse of the workspace ArcSwap dep (the same
# idiom the gateway route table + orchestrator AdminSnapshot use); NO new external dependency.
arc-swap = { workspace = true }
redb = { workspace = true }
vd-wire = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true } # R-6d4-A: the both-ends-restart replay proptest (dev-only)
# SPIKE-3a's snapshot-under-bulk p99 gate uses the ONE shared `vd_harness::latency::
# percentile_unstable` (HR3, shared with SPIKE-2a). Dev-scope only: harness sits above node,
# so a test-only edge is acyclic (no io-prod/connection-plane ref in node/sim/client).
vd-harness = { workspace = true }

[lints]
workspace = true
