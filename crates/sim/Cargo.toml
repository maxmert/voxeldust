[package]
name = "vd-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pure simulation: ECS systems, saga/authority FSMs (pure fn step), capability DAG (ShardProfile), and the sim::io ShardIo trait seam + in-memory test impls. No direct I/O ever (clippy-enforced)."

[dependencies]
vd-core = { workspace = true }
vd-wire = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
thiserror = { workspace = true }
glam = { workspace = true }
bevy_ecs = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# HR5: unit tests install a TRACE sink so every tracing macro's lazy field closure
# EVALUATES on the paths the tests already drive — without it the closures are dead
# regions coverage can never reach (no subscriber ⇒ tracing skips them).
tracing-subscriber = { workspace = true }

[lints]
workspace = true
