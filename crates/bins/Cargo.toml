[package]
name = "vd-bins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The node binaries: thin shells over the libs (config -> mesh -> build_app -> register -> tick loop). ONE shard binary (HR3); shard types are ShardProfile configs. The process-tier parity tests live here (CARGO_BIN_EXE)."
publish = false

[[bin]]
name = "vd-orchestrator"
path = "src/bin/orchestrator.rs"

[[bin]]
name = "vd-gateway"
path = "src/bin/gateway.rs"

[[bin]]
name = "vd-shard"
path = "src/bin/shard.rs"

# The dev-cluster port helper (HR6): resolves the DevPortScheme to shell-eval-able
# env so scripts never hand-compute a port. Trivial; depends only on vd-devproto.
[[bin]]
name = "vd-slot"
path = "src/bin/vd-slot.rs"

# The local-process dev-cluster launcher (HR6): up/down/status, replaces k3d for
# P1.5+. Generates trust + dev auth, spawns the cluster on DevPortScheme ports.
[[bin]]
name = "vd-devcluster"
path = "src/bin/vd-devcluster.rs"

# The headless dev-control client (HR6): the agent-operable client core
# (`vd-client`) wrapped in the process shell — net thread + step thread + the
# cfg-gated dev-control listener. Named `client` to match `scripts/client.sh`.
[[bin]]
name = "client"
path = "src/bin/client.rs"

# The agent-facing dev-control CLI: one JSON request per line to the client's
# localhost listener, one response line back. Pairs with the `dev-control` feature.
[[bin]]
name = "vdctl"
path = "src/bin/vdctl.rs"

# R-6d4-D: the process-tier SIGKILL-restart proof harness. A PLAIN [[bin]] (NOT required-features) so
# `CARGO_BIN_EXE_vd-outbox-testnode` is always defined for the `outbox_sigkill_restart` test; its `main` body
# is `#[cfg(feature = "store-test-hooks")]` (a release build compiles only the exit-2 stub — no test surface).
[[bin]]
name = "vd-outbox-testnode"
path = "src/bin/vd-outbox-testnode.rs"

[features]
# The localhost dev-control listener (HR6). NON-default and cfg-gated, so a release
# `cargo build -p vd-bins` contains NO listener code at all — absence is a compile
# fact, not a runtime flag. `scripts/client.sh` builds the `client` bin WITH it.
default = []
dev-control = []
# The windowed Bevy client (Slice-3 T4). OPT-IN so the headless/process-tier build stays
# Bevy-free + fast: `--features render` pulls vd-client-render (the ~8.8 GB Bevy dep) and
# enables the `client --window` mode. The default + dev-control builds contain no Bevy.
render = ["dep:vd-client-render", "dep:vd-client-harness"]
# TEST-ONLY (D-6 D-delta): forwards vd-io-prod/store-test-hooks so the orchestrator binary the crash test
# spawns carries the writer-pause hook. NON-default + ABSENT from release (a compile fact). The
# `orchestrator_crash` test is `#![cfg(feature = "store-test-hooks")]` and built via this flag.
store-test-hooks = ["vd-io-prod/store-test-hooks"]

[dependencies]
vd-core = { workspace = true }
vd-devproto = { workspace = true }
vd-client = { workspace = true }
vd-sim = { workspace = true }
vd-node = { workspace = true }
vd-connection-plane = { workspace = true }
vd-io-prod = { path = "../io-prod" }
vd-client-render = { workspace = true, optional = true }
# Tier-A: the run manifest + `capture_entry` alignment seam (used by the `--capture`
# client's dev-control listener to record each capture). Pulled in only with `render`.
vd-client-harness = { workspace = true, optional = true }
vd-wire = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
arc-swap = { workspace = true }
crossbeam-channel = { workspace = true }
axum = { workspace = true }
ed25519-dalek = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
postcard = { workspace = true }
# G-RENDER-SMOKE (render_smoke.rs, Tier-B/coverage-exempt): decode a captured PNG to RGBA8
# for the Tier-A smoke assertions. image 0.25 is already pinned at the workspace root (a
# dep of vd-client-render) — this is a dep MOVE into bins' test deps, not a new library.
image = { workspace = true }

[lints]
workspace = true
