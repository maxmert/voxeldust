[workspace]
resolver = "2"
members = [
    "types",
    "protocol-fb",
    "signal",
    "core",
    "shard-common",
    "orchestrator",
    "gateway",
    "stub-shard",
    "e2e-tests",
    "system-shard",
    "ship-shard",
    "planet-shard",
    "galaxy-shard",
    "client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
voxeldust-types = { path = "types" }
voxeldust-protocol-fb = { path = "protocol-fb" }
voxeldust-signal = { path = "signal" }
voxeldust-core = { path = "core" }
voxeldust-shard-common = { path = "shard-common" }
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Compact binary serde format. Used by `core/character/handoff_blob.rs` to
# pack body/head/turn-in-place state into the `PlayerHandoff::character_state`
# blob — the FB schema reserves it as `[ubyte]` and bincode gives us
# field-level forward compatibility (`#[serde(default)]`) without changing
# the wire schema each time we add a character component.
bincode = "1.3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "signal",
    "process",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
thiserror = "2"
flatbuffers = "24.12.23"
axum = "0.8"
redb = "2"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
brahe = "1.2"
gooding-lambert = "0.2"
nalgebra = "0.34"
rapier3d = "0.32"
wgpu = "23"
winit = "0.30"
egui = "0.30"
egui-wgpu = "0.30"
egui-winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
lz4_flex = "0.11"
bevy_ecs = { version = "0.18", features = ["multi_threaded"] }
bevy_app = "0.18"
bevy_tasks = "0.18"
binary-greedy-meshing = "0.5"
half = "2"
# OS-backed cryptographically-secure RNG — used for `block_uid` and per-channel
# `signature` generation in the signal pipeline (Phase 1+) and HMAC keys in
# Phase 3. `OsRng` is the right choice here: signal-level identity needs
# unforgeability across shard restarts, not just statistical randomness.
rand = "0.8"
# HMAC-SHA256 for cross-shard signal auth (Phase 3). Per-channel signature
# is the key; truncated 128-bit tag is what the wire carries. `sha2` is
# already in the lock file via rustls/ring, so the only new direct dep is
# the ~200-line `hmac` wrapper. `subtle` provides constant-time tag
# comparison so verifiers don't leak timing information about partial
# matches under attack.
hmac = "0.12"
sha2 = "0.10"
subtle = "2.5"
# Tiny inline-storage Vec — used by `RemoteAccessGrant` (typically 1–4
# channels per grant) and `SignalChannel.subscribers` (typically <8 refs).
# Avoids a heap allocation per grant in the common case.
smallvec = "1"
# base64 encoding for grant key transfer over the network — clients and
# the configurator UI work with text-friendly base64 strings; the wire
# carries the raw [u8; 32] bytes when efficiency matters and base64 when
# UX clarity matters (GrantsSnapshotData → tablet UI).
base64 = "0.22"
# Metrics facade — `counter!`/`gauge!`/`histogram!` macros become no-ops
# when no exporter is registered, so production code can sprinkle metric
# calls freely without runtime cost in test/dev builds. Pair with
# `metrics-exporter-prometheus` at the binary level when /metrics
# scraping is needed.
metrics = "0.24"
# Prometheus-format exporter for the `metrics` facade. We disable default
# features (the built-in HTTP listener) because every shard already runs
# an axum router on `healthz_addr` — adding the exporter to that router
# is one less port to expose, one less binding to coordinate in k8s.
# `PrometheusBuilder::install_recorder()` returns a `PrometheusHandle`
# (cheap to clone) whose `render()` produces the exposition payload.
metrics-exporter-prometheus = { version = "0.16", default-features = false }
# Used in unit tests for redb persistence (`grant_persistence`,
# future block-config tests). Not needed at runtime, but keeping it
# in the workspace deps lets every crate's `dev-dependencies`
# reference it without re-pinning a version.
tempfile = "3"

[profile.dev]
# `line-tables-only` keeps line numbers in panics/backtraces but halves the
# debuginfo we copy through the linker — meaningful saving on binaries that
# pull all of Bevy + wgpu + rapier.
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true

[profile.dev.package."*"]
# Bevy book recommendation: optimize all deps in dev (one-time compile cost,
# big runtime gain). Combined with "debug = false" the cached artifacts are
# also smaller, which speeds up linking.
opt-level = 3
debug = false

[profile.dev.package.noise]
opt-level = 3

[profile.dev.package.voxeldust-core]
opt-level = 2

# brahe v1.2 declares `pyo3` / `numpy` / `polars` / `rsofa` as MANDATORY
# (non-feature-gated) deps — its Cargo.toml is poorly factored. None of these
# are runtime hot-path code for voxeldust (orbital math runs once per planet
# tick, never per-frame), so we drop the whole chain to opt-level = 0 to skip
# the multi-minute compile cost they otherwise incur at the workspace-default
# `[profile.dev.package."*"] opt-level = 3`. See BUILD_PERF.md §"Heavy-dep
# overrides" for the full rationale + how to spot future offenders.
[profile.dev.package.brahe]
opt-level = 0

[profile.dev.package.pyo3]
opt-level = 0

[profile.dev.package.numpy]
opt-level = 0

[profile.dev.package.polars]
opt-level = 0

[profile.dev.package.rsofa]
opt-level = 0

# ─── release profile ────────────────────────────────────────────────────────
# Tuned for distributed shard binaries + the client. Keep line-tables in release
# so production logs still carry stack-trace line numbers — one of the only
# ways we have to debug a server-side incident post-mortem.

[profile.release]
lto = "thin"           # 10–15 % runtime, ~2× release-build time (acceptable)
codegen-units = 1      # max inlining
panic = "abort"        # smaller binaries, no unwind tables
strip = "symbols"
debug = "line-tables-only"

# `dist` profile: one-off slow build for shipped artifacts. Use `cargo build
# --profile dist` when cutting a release. PGO recipe documented in BUILD_PERF.md.
[profile.dist]
inherits = "release"
lto = "fat"
