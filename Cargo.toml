[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/wire",
    "crates/sim",
    "crates/node",
    "crates/connection-plane",
    "crates/harness",
    "crates/io-prod",
    "crates/bins",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
# Workspace crates (dependency rule: bins -> node -> sim -> wire -> core; harness -> node + sim; nothing depends on a bin)
vd-core = { path = "crates/core" }
vd-wire = { path = "crates/wire" }
vd-sim = { path = "crates/sim" }
vd-node = { path = "crates/node" }
vd-connection-plane = { path = "crates/connection-plane" }
vd-harness = { path = "crates/harness" }

# Pure-logic dependencies (Tier-A safe: no I/O)
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc", "use-std"] }
thiserror = "2"
glam = { version = "0.29", features = ["serde"] }
bevy_ecs = "0.18"
arc-swap = "1"
tracing = "0.1"

# Test-only
proptest = "1"

# Prod I/O (reachable ONLY behind the sim::io seam; later moves to io-prod)
tokio = { version = "1", features = ["full"] }
crossbeam-channel = "0.5"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
redb = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Deterministic world generation (pin exact noise version: cross-platform determinism)
noise = "=0.9.0"
brahe = "1.2"

# Identity
hmac = "0.12"
sha2 = "0.10"
ed25519-dalek = "2"

# Admin endpoint (io-prod only — Tier-B)
serde_json = "1"
axum = "0.8"

[workspace.lints.clippy]
# The disallowed-methods/types config lives in clippy.toml (sim/node scoped).
unwrap_used = "warn"

# Hot dependencies get optimized even in dev builds: debug-profile bevy_ecs makes a
# Schedule::run ~ms instead of ~µs, turning the 12k-tick harness gate from tens of
# milliseconds into a minute-plus. (Same lesson the old repo learned for noise/rapier.)
[profile.dev.package.bevy_ecs]
opt-level = 2
[profile.dev.package.bevy_tasks]
opt-level = 2
[profile.dev.package.bevy_utils]
opt-level = 2
[profile.dev.package.bevy_platform]
opt-level = 2
[profile.dev.package.bevy_reflect]
opt-level = 2
[profile.dev.package.fixedbitset]
opt-level = 2

# NOTE: re-add `[profile.dev.package.noise] opt-level = 3` when terrain generation
# lands (P4) — debug-profile noise is ~40x slower and unusable for terrain gen.
