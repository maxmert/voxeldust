# S4b — the gateway: client admission + session ownership. StatefulSet (per-pod M3 boot-counter PVC + a
# store-root PVC the cloud preflight requires of every node even though the gateway keeps no un-fsynced
# durable state). Headless Service + publishNotReadyAddresses so the orch resolves it for the ClockSync
# broadcast during cold start.
apiVersion: v1
kind: Service
metadata:
  name: vd-gateway
  namespace: voxeldust
  labels: { app: vd, role: gateway }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: vd, role: gateway }
  ports:
    - { name: mesh, port: 9000, protocol: UDP, targetPort: mesh }
    - { name: probe, port: 9002, protocol: TCP, targetPort: probe }
---
# ★ THE DOOR (2026-09-06): the one port a player's client OUTSIDE the cluster dials. A NodePort on the
# gateway's mesh UDP port; `just k3d-up` maps the host's door port (VD_K3D_DOOR_PORT, 19000) onto this
# node port, so a window on the developer's machine logs in at 127.0.0.1:19000 exactly as the agent
# pod logs in at the pod address. QUIC is client-initiated and symmetric, so the gateway needs no
# address of its own to answer — it learns the client as it learns any dial-in peer.
apiVersion: v1
kind: Service
metadata:
  name: vd-gateway-door
  namespace: voxeldust
  labels: { app: vd, role: gateway }
spec:
  type: NodePort
  selector: { app: vd, role: gateway }
  ports:
    - { name: mesh, port: 9000, protocol: UDP, targetPort: mesh, nodePort: 30900 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vd-gateway
  namespace: voxeldust
  labels: { app: vd, role: gateway }
spec:
  serviceName: vd-gateway
  replicas: 1
  podManagementPolicy: Parallel
  # ★ NOT A ROLLING UPDATE (owner ruling 2026-08-24, slice S1 — the saved-data label).
  #
  # The default here is RollingUpdate, which replaces pods one at a time and therefore produces a
  # MIXED-VERSION FLEET on every release, by design. That was survivable while nothing compared
  # versions. It is not survivable now: a durable file carries a label naming the world, the coordinate
  # units and the epoch that wrote it, and a process whose label disagrees REFUSES TO START. A rolling
  # update of a label-changing image therefore does not degrade — it partitions the cluster into the
  # pods that already restarted and the ones that have not, each refusing the other's files.
  #
  # `OnDelete` makes the replacement an explicit act: apply the manifest, then stop the pods yourself.
  # For a release that moves the label, that means stop-all-then-start, never one-at-a-time.
  updateStrategy: { type: OnDelete }
  selector:
    matchLabels: { app: vd, role: gateway }
  template:
    metadata:
      labels: { app: vd, role: gateway }
    spec:
      terminationGracePeriodSeconds: 15 # no un-fsynced durable state: drain is linger + teardown
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: voxeldust-server:dev
          imagePullPolicy: IfNotPresent
          command: ["entrypoint.sh", "vd-gateway"]
          envFrom:
            - configMapRef: { name: vd-cluster-env }
          env:
            - { name: VD_NODE_ID, value: "2" }
            - { name: VD_BIND, value: "0.0.0.0:9000" }
            - { name: VD_PROBE_ADDR, value: "0.0.0.0:9002" }
            - { name: VD_ADMIN_ADDR, value: "0.0.0.0:9100" } # read-only /admin/snapshot + /metrics (the lane counters a cloud diagnosis needs)
            - { name: VD_ORCH, value: "1" }
            - { name: VD_SHARD, value: "3" } # the login-home DEFAULT id the bin still parses; the demand resolve supersedes it per login
            - { name: VD_DEMAND, value: "1" } # the dynamic-home login route: a login demands its home realm
            - { name: VD_BOOT_TICKS_P99, value: "500" } # must equal the orchestrator's, or the two sides disagree
            - { name: VD_SESSION_SEED, value: "23" }
            - { name: VD_MAX_SESSIONS, value: "8" }
            - { name: VD_MAX_BUFFERED_INPUTS, value: "256" } # == TransportTuning::DEFAULT_MAX_BUFFERED_INPUTS (the DEV/parity value); required (no code default)
            - name: VD_AUTH_PUBKEY # a REAL non-dev key (cloud vetoes the 0x42 dev key); minted by `just k3d-secrets`
              valueFrom:
                secretKeyRef: { name: vd-auth, key: AUTH_PUBKEY }
          ports:
            - { name: mesh, containerPort: 9000, protocol: UDP }
            - { name: probe, containerPort: 9002, protocol: TCP }
            - { name: admin, containerPort: 9100, protocol: TCP }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: # Burstable (no un-fsynced durable state)
            # MEASURED 2026-09-06 (release): the gateway peaks 306 MB while it plants the home system
            # and folds the sky, and keeps ~22 MB after. It was 5.3 GB before the plant fix.
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          livenessProbe:
            httpGet: { path: /healthz, port: probe }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
            successThreshold: 1
          readinessProbe:
            httpGet: { path: /readyz, port: probe }
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - { name: data, mountPath: /var/lib/vd } # store root (empty day-1; the cloud preflight requires it)
            - { name: boot, mountPath: /var/lib/vd-boot } # M3 boot-counter
            - { name: trust, mountPath: /etc/vd/trust, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: trust, secret: { secretName: vd-mtls, defaultMode: 0400 } }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: { requests: { storage: 256Mi } }
    - metadata: { name: boot }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: { requests: { storage: 64Mi } }
