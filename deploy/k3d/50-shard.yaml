# S4b — the shard: the sim/realm authority. StatefulSet (per-pod M3 boot-counter PVC + the cloud-required
# store root). Headless Service + publishNotReadyAddresses so the orch resolves it for the ClockSync
# broadcast during cold start. Reads VD_TICK_DT and VD_SPEED from the ConfigMap (shared with the gateway,
# which now builds the same world from them) and cross-checks the tick pair against VD_TICK_HZ at
# boot (vd_bins::validate_tick_pair).
apiVersion: v1
kind: Service
metadata:
  name: vd-shard
  namespace: voxeldust
  labels: { app: vd, role: shard }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: vd, role: shard }
  ports:
    - { name: mesh, port: 9000, protocol: UDP, targetPort: mesh }
    - { name: probe, port: 9002, protocol: TCP, targetPort: probe }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vd-shard
  namespace: voxeldust
  labels: { app: vd, role: shard }
spec:
  serviceName: vd-shard
  replicas: 1
  podManagementPolicy: Parallel
  # ★ NOT A ROLLING UPDATE (owner ruling 2026-08-24, slice S1 — the saved-data label).
  #
  # The default here is RollingUpdate, which replaces pods one at a time and therefore produces a
  # MIXED-VERSION FLEET on every release, by design. That was survivable while nothing compared
  # versions. It is not survivable now: a durable file carries a label naming the world, the coordinate
  # units and the epoch that wrote it, and a process whose label disagrees REFUSES TO START. A rolling
  # update of a label-changing image therefore does not degrade — it partitions the cluster into the
  # pods that already restarted and the ones that have not, each refusing the other's files.
  #
  # `OnDelete` makes the replacement an explicit act: apply the manifest, then stop the pods yourself.
  # For a release that moves the label, that means stop-all-then-start, never one-at-a-time.
  updateStrategy: { type: OnDelete }
  selector:
    matchLabels: { app: vd, role: shard }
  template:
    metadata:
      labels: { app: vd, role: shard }
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: shard
          image: voxeldust-server:dev
          imagePullPolicy: IfNotPresent
          command: ["entrypoint.sh", "vd-shard"]
          envFrom:
            - configMapRef: { name: vd-cluster-env }
          env:
            - { name: VD_NODE_ID, value: "3" }
            - { name: VD_BIND, value: "0.0.0.0:9000" }
            - { name: VD_PROBE_ADDR, value: "0.0.0.0:9002" }
            - { name: VD_ORCH, value: "1" }
            - { name: VD_REALM_SEED, value: "7" }
            - { name: VD_MINT_SEED, value: "11" }
            - { name: VD_INPUT_LOG_CAP, value: "4096" }
            - { name: VD_SNAPSHOT_BUDGET, value: "1100" } # <= CONSERVATIVE_DATAGRAM_BUDGET (asserted at boot)
            # THE SHARD'S DURABLE OUTBOX (R-6d). A shard says things nobody re-says for it — "this
            # occupant left your interest" is sent once — so a crash between the send and the
            # acknowledgement lost the message and froze a figure on a player's screen. The file sits on
            # the `data` PVC mounted at /var/lib/vd, which IS VD_STORE_DURABLE_ROOT (10-configmap.yaml),
            # so the durability allow-list admits it and NO ephemeral escape is taken here. The gateway
            # gets none by decision (it holds only what it derived from others) and the orchestrator gets
            # none by design (its flows are re-driven from its own directory state).
            - { name: VD_OUTBOX_PATH, value: "/var/lib/vd/outbox.redb" }
          ports:
            - { name: mesh, containerPort: 9000, protocol: UDP }
            - { name: probe, containerPort: 9002, protocol: TCP }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
          livenessProbe:
            httpGet: { path: /healthz, port: probe }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
            successThreshold: 1
          readinessProbe:
            httpGet: { path: /readyz, port: probe }
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - { name: data, mountPath: /var/lib/vd }
            - { name: boot, mountPath: /var/lib/vd-boot }
            - { name: trust, mountPath: /etc/vd/trust, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: trust, secret: { secretName: vd-mtls, defaultMode: 0400 } }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: { requests: { storage: 256Mi } }
    - metadata: { name: boot }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: { requests: { storage: 64Mi } }
