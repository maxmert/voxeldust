# S4b — the shared cloud env every server pod reads via envFrom. Sets EXACTLY the cloud-profile-required
# roots + the tick pair; NONE of the forbidden knobs (no VD_*_EPHEMERAL_OK, no VD_PROCESS_INCARNATION, no
# D-3 knob — the cloud profile derives the active D-3 set from VD_TICK_HZ). VD_TICK_HZ and VD_TICK_DT are
# BOTH here (one object) so a retune can't drift them across files; the shard also cross-checks the pair at
# boot (vd_bins::validate_tick_pair).
apiVersion: v1
kind: ConfigMap
metadata:
  name: vd-cluster-env
  namespace: voxeldust
  labels:
    app: vd
data:
  # ★ THE PROFILE IS DEV, BY MEASUREMENT (foundation slice 5, 2026-09-06). This cluster runs the game's
  # real shape — the demand loop, forked realm shards, durable roots, no escapes — but the CLOUD profile
  # refuses VD_DEMAND on every role, and it is right to: a realm demand is folded by the node id its
  # frame claims, and the mesh trust is ONE shared bundle every member holds, so any bundle holder could
  # dial the orchestrator and spawn realms at will. The cure is per-node identity (P7,
  # identity_persistence), not a manifest. Until then this k3d cluster is a DEV cluster in the cloud's
  # shape: every other cloud rule below still holds (durable roots, boot counters, no escapes), and the
  # cloud preflight test keeps refusing an armed demand route under `cloud`. Measured on the dev cluster:
  # twelve login demands per session from the gateway, which the directory check names as "holds neither
  # the realm nor its parent" — the lawful-sender rule must admit a gateway holding a session lease.
  VD_PROFILE: "dev"
  VD_TICK_HZ: "50"
  VD_TICK_DT: "0.02" # == 1/50; kept beside VD_TICK_HZ so they retune together
  # The occupant's max speed. HERE, not on the shard pod, because BOTH the shard and the gateway build the
  # world from it now — the gateway decides which realm a login lands in, and it must reach that answer with
  # the same numbers the shard will then simulate by. Split across two files it would drift silently.
  VD_SPEED: "2.0"
  VD_OUTBOUND_CAP: "256"
  VD_TRUST_DIR: "/etc/vd/trust"
  VD_STORE_DURABLE_ROOT: "/var/lib/vd"
  VD_BOOT_DURABLE_ROOT: "/var/lib/vd-boot"
  VD_BOOT_STATE_DIR: "/var/lib/vd-boot/state" # BootCounter create_dir_all's this under the boot PVC
  VD_SHUTDOWN_LINGER_MS: "2000" # preStop drain linger; well below every terminationGracePeriodSeconds
  VD_CLOCK_PEERS: "2" # IP-free NodeId: the gateway, the one booked follower. A demand-spawned shard is clocked by its launcher's book, not by this list.
  # THE WORLD'S SEED, stated (foundation slice 5, 2026-09-06): every node builds the same world from it —
  # the gateway plants the home system, a spawned shard plants its own subtree, the sky folds the layer.
  VD_UNIVERSE_SEED: "2298"
  # THE FORKED SHARDS' MUST-PARSE PARAMETERS (foundation slice 5). They lived on the static shard's
  # manifest; a demand-spawned shard inherits them from the ORCHESTRATOR's environment (the spawn
  # anchors), so they live cluster-wide here. Measured: a child refused with Missing("VD_SNAPSHOT_BUDGET").
  VD_SNAPSHOT_BUDGET: "1100" # <= CONSERVATIVE_DATAGRAM_BUDGET (asserted at boot)
  VD_MINT_SEED: "11"
  VD_INPUT_LOG_CAP: "4096"
