# S4b — NetworkPolicies. NOTE (D3): k3d's default flannel CNI does NOT enforce NetworkPolicy, so these are
# DECLARATIVE INTENT day-1 (the real isolation is the mesh mTLS + an isolated single-node cluster). Do NOT
# port this to a shared/multi-tenant node without a policy-enforcing CNI (Calico/Cilium). Reach the unauth
# /admin + /metrics via `kubectl port-forward` (the API/kubelet path), never a pod-network ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vd-default-deny
  namespace: voxeldust
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vd-allow-probe
  namespace: voxeldust
spec:
  podSelector:
    matchLabels: { app: vd }
  policyTypes: [Ingress]
  ingress:
    # kubelet has no pod identity, so `from` is empty (any) — the probe is a bodyless status code, no leak.
    - ports:
        - { port: 9002, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vd-allow-mesh
  namespace: voxeldust
spec:
  podSelector:
    matchLabels: { app: vd }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: vd }
      ports:
        - { port: 9000, protocol: UDP }
        # THE SPAWN PORT BAND (foundation slice 5, 2026-09-06): the orchestrator pod forks realm
        # shards that bind its own address on VD_RLM_FIRST_PORT..VD_RLM_PORT_LIMIT; the gateway and
        # the agent reach them there. Same UDP mesh, same peers, more ports.
        - { port: 45000, endPort: 45999, protocol: UDP }
  egress:
    - to:
        - podSelector:
            matchLabels: { app: vd }
      ports:
        - { port: 9000, protocol: UDP }
        - { port: 45000, endPort: 45999, protocol: UDP }
---
# ★ THE DOOR (2026-09-06): a player's client dials the gateway from OUTSIDE the pod network (the node
# port the host's door maps onto; the source is the node's own address after the service's translation),
# so the gateway alone admits UDP 9000 from anywhere. Every other pod keeps the mesh-only rule above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vd-allow-door
  namespace: voxeldust
spec:
  podSelector:
    matchLabels: { app: vd, role: gateway }
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { port: 9000, protocol: UDP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vd-allow-dns
  namespace: voxeldust
spec:
  podSelector:
    matchLabels: { app: vd }
  policyTypes: [Egress]
  egress:
    # the entrypoint getent needs CoreDNS (kube-system) to resolve the peer Service names.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vd-allow-admin
  namespace: voxeldust
spec:
  # orch-only: the unauth topology /admin + /metrics, namespace-scoped ingress (still declarative on flannel).
  podSelector:
    matchLabels: { app: vd, role: orch }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: voxeldust }
      ports:
        - { port: 9100, protocol: TCP }
